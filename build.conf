.distribution: &distribution
    versions: [ supported ]
    repository: &repository
        name: pdidev
        description: "PDI dev packages"
    gpg:
        file: "key.gpg"
distribs:
    debian:
        <<: *distribution
        versions: [ supported, testing, sid ]
        repository:
            <<: *repository
            path: "repo.debian"
            url: "https://repo.pdi.dev/debian/"
    ubuntu:
        <<: *distribution
        repository:
            <<: *repository
            path: "repo.ubuntu"
            url: "https://repo.pdi.dev/ubuntu/"
    fedora:
        <<: *distribution
        repository:
            <<: *repository
            path: "repo.fedora"
            url: "https://repo.pdi.dev/fedora/"
packages:
    paraconf:
        orig: "https://github.com/pdidev/paraconf/archive/{upstream_version}.tar.gz"
    pdi:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    pdidev-archive-keyring:
        disable: { fedora: all }
    pdiplugin-decl-hdf5:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    pdiplugin-decl-netcdf:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    pdiplugin-mpi:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    pdiplugin-pycall:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    pdiplugin-serialize:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    pdiplugin-set-value:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    pdiplugin-trace:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    pdiplugin-user-code:
        orig: "https://gitlab.maisondelasimulation.fr/pdidev/pdi/-/archive/{upstream_version}/pdi-{upstream_version}.tar.bz2"
    zpp:
        orig: "https://github.com/jbigot/zpp/archive/{upstream_version}.tar.gz"
